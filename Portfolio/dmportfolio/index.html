<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dmportfolio</title>
  <link rel="stylesheet" href="src/index.css">
</head>
<body>

  <nav class="sidebar" id="sidebar">
    <div class="toggle-btn" id="toggleBtn">☰</div>
    <ul>
      <li><a href="#"><span class="icon">🏠</span><span class="text">  Intro</span></a></li>
      <li><a href="#"><span class="icon">💡</span><span class="text">Projects</span></a></li>
      <li><a href="#"><span class="icon">🛠️</span><span class="text">Skills</span></a></li>
      <li><a href="#"><span class="icon">💬</span><span class="text">Contact</span></a></li>
    </ul>
  </nav>

  <script>
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleBtn");

    toggleBtn.addEventListener("click", () => {
      if (window.innerWidth <= 900) {
        sidebar.classList.toggle("active"); 
      } else {
        sidebar.classList.toggle("collapsed");
      }
    });
  </script>


  <main class="wrap" role="main">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Test</h1>
      <p>Test 2 </p>
      <div class="cards" aria-live="polite">
        <article class="card">
          <h3>Test3</h3>
          <small>Test3a </small>
        </article>
        <article class="card">
          <h3>Test4</h3>
          <small>Test4a</small>
        </article>
        <article class="card">
          <h3>Test5</h3>
          <small>Test5a</small>
        </article>
        <article class="card">
          <h3>Test6</h3>
          <small>Test6a</small>
        </article>
      </div>

      <div class="footer">Footer test</div>
    </section>

    <aside class="panel" aria-labelledby="panel-title">
      <h2 id="panel-title">Test7</h2>
      <p>Test8</p>
      <a class="btn" href="#">Test Button</a>
    </aside>
  </main>
</body>
</html>
